<title>Treinamentos Mavaular</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: visual do app Aniversariantes — barra preta com logo, fundo cinza-claro, cartões brancos arredondados. Tema único (claro). */
:root{
  color-scheme:light;
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f5f6f8; --line:#e5e7eb;
  --fg:#1f2937; --muted:#6b7280; --accent:#1e3a6e; --accent-soft:#e6ecf6; --hi:#f4761f; --hi-2:#f6a92c;
  --ok:#15803d; --ok-soft:#dcf3e4; --bad:#b91c1c; --bad-soft:#fde4e4; --warn:#b45309; --warn-soft:#fff2df;
  --f-display:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; --rc:14px; --shadow:0 1px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 64px}
.topbar{background:#0b0b0c;color:#fff}
.topbar-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar-title{font-weight:700;font-size:17px;margin:0}
.topbar-sub{font-size:12px;color:#a6a9ae;margin-top:3px}
.topbar img{height:52px;display:block}
.topbar-right{justify-self:end;font-size:12px;color:#c7c9cd;text-align:right}
@media (max-width:640px){.topbar-in{grid-template-columns:minmax(0,1fr) auto}.topbar-right{display:none}.topbar img{height:40px}}
.tabbar{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs button{font:600 14px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 12px 9px;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--hi)}
.hero-banner{background:linear-gradient(90deg,var(--hi-2),var(--hi));border-radius:var(--rc);padding:16px 18px;color:#fff;text-align:center;box-shadow:0 4px 14px rgba(244,118,31,.3);margin-top:18px;cursor:pointer;border:0;width:100%;font:inherit}
.hero-banner.blue{background:linear-gradient(90deg,#4f83cc,#1e3a6e);box-shadow:0 4px 14px rgba(30,58,110,.25)}
.hero-banner .title{font-weight:700;font-size:16px}
.hero-banner .names{font-size:15px;margin-top:3px}
button,select,input,textarea{font-family:inherit;font-size:14px;color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--fg)}
.mat-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted)}
.banner{margin-top:14px;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
section.view{margin-top:20px}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;color:var(--accent)}
h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;color:var(--accent)}
.label{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Agenda */
.agenda{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.agenda{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface);border:0;border-radius:var(--rc);box-shadow:var(--shadow);padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-head .nav{display:flex;gap:4px;align-items:center}
.cal-head h2{text-transform:capitalize;min-width:150px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grid7 .dow{background:var(--surface-2);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:5px 6px}
.day{background:var(--surface);min-height:92px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;text-align:left;min-width:0}
.day:hover{background:var(--surface-2)}
.day.out{color:var(--muted);background:var(--bg)}
.day .n{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--hi);color:#fff;border-radius:3px;padding:0 4px;align-self:flex-start}
.chip{display:block;font-size:12px;line-height:1.25;padding:2px 5px;border-radius:3px;background:var(--accent-soft);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--accent)}
.chip.done{border-left-color:var(--ok);background:var(--ok-soft)}
.chip.pend{border-left-color:var(--warn);background:var(--warn-soft)}
@media (max-width:560px){.day{min-height:54px}.chip{font-size:0;padding:0;height:6px;border-left:0;background:var(--accent)}.chip.done{background:var(--ok)}.chip.pend{background:var(--warn)}}
.side{display:flex;flex-direction:column;gap:16px}
.list{background:var(--surface);border:0;border-radius:var(--rc);box-shadow:var(--shadow)}
.list h3{padding:10px 12px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.datebox{text-align:center;border:1px solid var(--line);border-radius:4px;padding:3px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.datebox b{display:block;font-size:18px;font-weight:500;line-height:1.1}
.datebox span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.empty{padding:14px 12px;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:1px 7px;border-radius:999px;text-transform:uppercase}
.pill.ag{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.pe{background:var(--warn-soft);color:var(--warn)}

/* Detalhe */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:0;border-radius:var(--rc);box-shadow:var(--shadow);padding:16px}
.facts{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:14px 0 0}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts ul{margin:0;padding-left:18px}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}.facts dd{margin-bottom:6px}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.back{margin-bottom:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-p{background:var(--ok-soft);color:var(--ok)}
.seg button.on-f{background:var(--bad-soft);color:var(--bad)}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:16px}
.iconbtn:hover{color:var(--bad)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.addrow input,.addrow select{min-width:0}
.summary-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.summary-line b{font-variant-numeric:tabular-nums}

/* Formulários */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea{min-height:90px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:680px;padding:18px}
.modal h2{margin-bottom:14px}
.confirm{margin-top:10px;padding:10px 12px;border:1px solid var(--bad);border-radius:var(--r);background:var(--bad-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Indicadores */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filters .field{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:0;border-radius:var(--rc);box-shadow:var(--shadow);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi span.sub{font-size:12px;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}
.ind-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:900px){.ind-grid{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar-row .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar-row .top span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.bar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--surface-2);margin-top:4px}
.bar i{display:block;height:100%}
.bar i.p{background:var(--ok)} .bar i.f{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rate{font-variant-numeric:tabular-nums;font-weight:600}
.rate.lo{color:var(--bad)} .rate.hi{color:var(--ok)}

/* Seletor de participantes */
.picker{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pk-tools{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
@media (max-width:520px){.pk-tools{grid-template-columns:minmax(0,1fr)}}
.pk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pk-list{margin-top:8px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pk-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.pk-item:last-child{border-bottom:0}
.pk-item:hover{background:var(--surface-2)}
.pk-item input{width:16px;height:16px;flex:0 0 auto;accent-color:var(--accent)}
.pk-n{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.pk-s{flex:0 0 auto;font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:999px}
.pk-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk-chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;padding:3px 4px 3px 9px;border-radius:999px}
.pk-chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.portal-btn{background:#fff;color:#111;border:0;border-radius:8px;padding:8px 14px;font:600 12px var(--f-body);cursor:pointer;white-space:nowrap}
.portal-btn:hover{background:#e9e9ea}.portal-btn:disabled{opacity:.6;cursor:default}
.portal-msg{font-size:11px;color:#a6a9ae;margin-top:4px}
@media (max-width:640px){.topbar-right{display:block!important;grid-column:1/-1;justify-self:start;text-align:left}}
/* Materiais */
.mat{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mat-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:var(--r)}
.mat-list .ext{flex:0 0 auto;width:42px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:6px 0}
.mat-list .mi{flex:1 1 auto;min-width:0}
.mat-list .mn{font-weight:600;overflow-wrap:anywhere}
label.btn{cursor:pointer}
/* Folha (pré-visualização) */
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:22px 24px;font-family:Arial,sans-serif;font-size:13px;margin-top:14px;overflow-x:auto}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet img{width:110px;height:auto}
.sheet h4{text-align:center;font-size:17px;margin:4px 0 2px}
.sheet .sub{text-align:center;margin-bottom:10px}
.sheet p{margin:3px 0}
.sheet table{font-size:12.5px;margin-top:10px;min-width:460px}
.sheet td,.sheet th{border:1px solid #888;color:#111;padding:6px}
.sheet th{font-family:Arial,sans-serif;letter-spacing:0;text-transform:none;font-size:12px;font-weight:700;background:#eee}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#1f2937;color:#fff;padding:8px 14px;border-radius:var(--r);font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.btn,.day,.item{transition:background-color .12s,border-color .12s}}
</style>

<div class="topbar"><div class="topbar-in">
  <div><h1 class="topbar-title">Treinamentos Mavaular</h1><div class="topbar-sub" id="subtitle"></div></div>
  <img src="__LOGO2__" alt="Mavaular Móveis">
  <div class="topbar-right" id="topbar-right">Gestão de pessoas</div>
</div></div>
<div class="tabbar"><nav class="tabs" aria-label="Seções">
  <button id="tab-agenda" data-view="agenda">Agenda</button>
  <button id="tab-indicadores" data-view="indicadores">Indicadores</button>
  <button id="tab-colaboradores" data-view="colaboradores">Colaboradores</button>
</nav></div>
<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <main id="app"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
const LOGO = "data:image/png;base64,__LOGO__";
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_AB = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

const SNAP = window.__SNAP || null; const PORTAL = !!SNAP;
const chamadaDe = t => PORTAL ? (t.chamada||[]) : (t.participantes||[]);
const S = {
  view: "agenda", detailId: null,
  month: (()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()}})(),
  trainings: [], people: [], loaded:{t:false,p:false},
  canWrite: true, db: null, downloads: null,
  filt: {de:"", ate:"", setor:""},
  confirmDel: false,
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : null;
const fmtPct = v => v==null ? "—" : v.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const norm = s => String(s||"").trim();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function banner(msg){ const b=$("#banner"); if(!msg){b.hidden=true;return;} b.textContent=msg; b.hidden=false; }

function status(t){
  const parts = chamadaDe(t);
  const marked = parts.filter(p=>p.presenca==="presente"||p.presenca==="falta").length;
  if (t.data > todayISO()) return {k:"ag", txt:"Agendado"};
  if (parts.length && marked===parts.length) return {k:"ok", txt:"Realizado"};
  if (t.data === todayISO() && !marked) return {k:"ag", txt:"Hoje"};
  return {k:"pe", txt:"Chamada pendente"};
}

/* ---------- escrita (uma por documento por vez) ---------- */
const queues = {};
function write(path, fn){
  if (!S.db){ toast("Sem conexão com a base de dados."); return Promise.resolve(); }
  const q = (queues[path]||Promise.resolve()).then(fn).catch(e=>{
    if (e && e.code==="invalid_argument"){ S.canWrite=false; banner("Você tem acesso só de leitura a esta página."); render(); }
    else if (e && e.code==="quota_exceeded") toast("Limite de registros atingido. Exclua treinamentos antigos.");
    else toast("Não foi possível salvar. Tente de novo.");
  });
  queues[path]=q; return q;
}
function saveTraining(t){ const {id,...body}=t; return write("treinamentos/"+id, ()=>S.db.collection("treinamentos").doc(id).set(body)); }

/* ---------- navegação ---------- */
function go(view, id){
  S.view=view; S.detailId=id||null; S.confirmDel=false; S.confirmMat=null;
  try{ location.hash = view==="detalhe" ? "t-"+id : view; }catch(e){}
  render(); window.scrollTo(0,0);
}
function fromHash(){
  const h=(location.hash||"").slice(1);
  if (h.startsWith("t-")){ S.view="detalhe"; S.detailId=h.slice(2); }
  else if (["agenda","indicadores","colaboradores"].includes(h)) S.view=h;
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
window.addEventListener("hashchange",()=>{fromHash();render();});

/* ---------- render ---------- */
function renderTopRight(){
  const el=$("#topbar-right"); if(!el||PORTAL) return;
  if(!S.canWrite){ el.textContent="Gestão de pessoas"; return; }
  el.innerHTML=`<button class="portal-btn" id="btn-portal" ${S.portalBusy?"disabled":""}>${S.portalBusy?"Atualizando…":"↻ Atualizar portal"}</button>${S.portalMsg?`<div class="portal-msg">${esc(S.portalMsg)}</div>`:""}`;
  $("#btn-portal").onclick=atualizarPortal;
}
function render(){
  renderTopRight();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.view===S.view || (S.view==="detalhe"&&b.dataset.view==="agenda"))));
  const app=$("#app");
  if (S.view==="indicadores") app.innerHTML=viewInd();
  else if (S.view==="colaboradores") app.innerHTML=viewPeople();

const OFFICE={pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
const CHUNK=18*1024*1024; // caracteres base64 por parte (múltiplo de 4)
function lerBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const u=String(r.result); res(u.slice(u.indexOf(",")+1)); }; r.onerror=()=>rej(r.error); r.readAsDataURL(f); }); }
function b64ParaBytes(txt){ const bin=atob(txt.replace(/\s+/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
const MIME={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",txt:"text/plain",csv:"text/csv",md:"text/markdown"};
function matMsg(t){ const el=$("#mat-msg"); if(el){ el.hidden=!t; el.textContent=t||""; } }
async function anexarMateriais(files){
  const t=cur(); if(!t||!S.assets) return; const novos=[]; const erros=[];
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase(); const type=MIME[ext]; const office=OFFICE[ext];
    if(!type&&!office){ erros.push(`${f.name}: formato não aceito${/^(ppt|pps|ppsx|doc|xls)$/.test(ext)?" (salve no formato novo: .pptx, .docx ou .xlsx)":""}`); continue; }
    if(type&&f.size>20*1048576){ erros.push(`${f.name}: maior que 20 MB`); continue; }
    if(office&&f.size>100*1048576){ erros.push(`${f.name}: maior que 100 MB`); continue; }
    matMsg(`Enviando ${f.name}…`);
    const enviados=[];
    try{
      if(type){ const r=await S.assets.upload(f,{type}); enviados.push(r.id); novos.push({id:r.id,nome:f.name,tipo:type,tamanho:r.sizeBytes||f.size,enviadoEm:new Date().toISOString()}); }
      else {
        const b64=await lerBase64(f); const partes=Math.ceil(b64.length/CHUNK)||1;
        for(let k=0;k<partes;k++){
          matMsg(`Enviando ${f.name}${partes>1?` (parte ${k+1} de ${partes})`:""}…`);
          const blob=new Blob([b64.slice(k*CHUNK,(k+1)*CHUNK)],{type:"text/plain"});
          const r=await S.assets.upload(blob,{type:"text/plain"}); enviados.push(r.id);
        }
        novos.push({id:enviados[0],ids:enviados,enc:"b64",nome:f.name,tipo:office,tamanho:f.size,enviadoEm:new Date().toISOString()});
      }
    }
    catch(e){ for(const id of enviados){ try{await S.assets.delete(id);}catch(_){} } erros.push(`${f.name}: ${e&&e.code==="unsupported_type"?"formato não aceito":e&&e.code==="quota_exceeded"?"espaço de armazenamento cheio":"falha no envio"}`); }
  }
  if(novos.length) mutate(c=>{ c.materiais=[...(c.materiais||[]),...novos]; });
  matMsg(erros.length?"Não enviados: "+erros.join("; "):""); if(novos.length) toast(novos.length===1?"Material anexado":`${novos.length} materiais anexados`);
}
async function baixarMaterial(i){
  const t=cur(); const m=(t&&t.materiais||[])[i]; if(!m) return;
  const url="/_blob/"+m.id;
  if(!S.downloads){ if(m.enc==="b64"){ matMsg("Abra a página no Claude para baixar este arquivo."); return; } window.open(url,"_blank","noopener"); return; }
  try{
    matMsg("Preparando download…"); let blob;
    if(m.enc==="b64"){
      const partes=[]; for(const id of (m.ids||[m.id])){ const r=await fetch("/_blob/"+id); if(!r.ok) throw {code:"fetch"}; partes.push(b64ParaBytes(await r.text())); }
      blob=new Blob(partes,{type:m.tipo});
    } else { const r=await fetch(url); if(!r.ok) throw {code:"fetch"}; blob=await r.blob(); }
    matMsg(""); await S.downloads.save({filename:m.nome,data:blob});
  }
  catch(e){ if(e&&e.code==="declined"){matMsg("");return;} matMsg(e&&e.code==="rate_limited"?"Já há um download aberto. Aguarde e tente de novo.":"Não foi possível baixar este arquivo agora. Tente de novo em instantes."); }
}

}

function computeInd(){
  const {de,ate,setor}=S.filt; const today=todayISO();
  const ts=S.trainings.filter(t=>(!de||t.data>=de)&&(!ate||t.data<=ate));
  const done=ts.filter(t=>t.data<=today);
  let pres=0,falt=0,conv=0,horas=0; const bySetor={}, byPessoa={}; const rows=[];
  done.forEach(t=>{
    let tp=0,tf=0,tc=0;
    chamadaDe(t).forEach(p=>{
      if (setor && (p.setor||"Sem setor")!==setor) return;
      const sk=p.setor||"Sem setor"; tc++;
      const bs=bySetor[sk]=bySetor[sk]||{p:0,f:0,c:0,ts:new Set()}; bs.c++;
      const pk=String(p.nome||"").toUpperCase(); const bp=byPessoa[pk]=byPessoa[pk]||{nome:p.nome||"",setor:sk,p:0,f:0};
      if (p.presenca==="presente"){tp++;bs.p++;bp.p++;bs.ts.add(t.id)}
      else if (p.presenca==="falta"){tf++;bs.f++;bp.f++}
    });
    pres+=tp; falt+=tf; conv+=tc;
    if (tc) rows.push({t,tp,tf,tc});
    const h=parseFloat(String(t.cargaHoraria||"").replace(",","."))||0; if (tp) horas+=h*tp;
  });
  const fut=ts.filter(t=>t.data>today).length;
  return {ts,done,fut,pres,falt,conv,horas,bySetor,byPessoa,rows};
}

/* ---------- PDF ---------- */
function buildPDF(t){
  const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=18; let y=14;
  const header=()=>{ doc.addImage(LOGO,"PNG",W-M-36,10,36,15.6); };
  header(); y=32;
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Lista de Presença",W/2,y,{align:"center"}); y+=6;
  doc.setFont("helvetica","normal"); doc.setFontSize(11); if(t.tipo){doc.text(t.tipo,W/2,y,{align:"center"}); y+=8;} else y+=4;
  const line=(lab,val)=>{ if(!val) return; doc.setFont("helvetica","bold"); doc.text(lab,M,y); const lw=doc.getTextWidth(lab+" "); doc.setFont("helvetica","normal"); const ls=doc.splitTextToSize(String(val),W-2*M-lw); doc.text(ls,M+lw,y); y+=5.6*ls.length; };
  line("Tema:",t.nome); line("Assunto:",t.assunto); line("Data:",fmtDate(t.data)+(t.hora?" — "+t.hora:"")); line("Local:",t.local);
  line("Carga horária:",t.cargaHoraria); line("Público alvo:",t.publico); line("Facilitador:",t.facilitador);
  const cont=norm(t.conteudo).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(cont.length){ y+=2; doc.setFont("helvetica","bold"); doc.text("Conteúdo",M,y); y+=5.6; doc.setFont("helvetica","normal");
    cont.forEach(c=>{ const ls=doc.splitTextToSize(c,W-2*M-6); doc.text("•",M+1,y); doc.text(ls,M+6,y); y+=5.4*ls.length; }); }
  y+=5; doc.setFont("helvetica","bold"); doc.text("ASSINATURA DOS PARTICIPANTES:",M,y); y+=4;
  const cols=[{w:10,h:"Nº"},{w:68,h:"Nome"},{w:32,h:"Setor"},{w:W-2*M-110,h:"Assinatura"}]; const RH=9.5;
  const thead=()=>{ let x=M; doc.setFillColor(235,235,235); doc.rect(M,y,W-2*M,7,"F"); doc.setFontSize(9.5); doc.setFont("helvetica","bold");
    cols.forEach(c=>{doc.rect(x,y,c.w,7); doc.text(c.h,x+2,y+4.8); x+=c.w;}); y+=7; doc.setFont("helvetica","normal"); };
  thead();
  const parts=(t.participantes||[]); const rows=[...parts.map(p=>[p.nome,p.setor||""]), ...Array.from({length:Math.max(3, 0)},()=>["",""])];
  rows.forEach((r,i)=>{
    if(y+RH>280){ doc.addPage(); header(); y=32; thead(); }
    let x=M; doc.setFontSize(9.5);
    const vals=[String(i+1), r[0], r[1], ""];
    cols.forEach((c,j)=>{ doc.rect(x,y,c.w,RH); if(vals[j]){ const tx=doc.splitTextToSize(vals[j],c.w-3)[0]; doc.text(tx,x+2,y+6);} x+=c.w; });
    y+=RH;
  });
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8.5); doc.setTextColor(120); doc.text(`Mavaular Móveis · ${t.nome} · ${fmtDate(t.data)}`,M,290); doc.text(`Página ${i} de ${n}`,W-M,290,{align:"right"}); doc.setTextColor(0); }
  return doc.output("arraybuffer");
}
async function downloadPDF(){
  const t=cur(); if(!t) return; const note=$("#dl-note");
  if(!window.jspdf){ note.hidden=false; note.textContent="O gerador de PDF não carregou. Recarregue a página."; return; }
  if(!S.downloads){ note.hidden=false; note.textContent="Download indisponível nesta visualização. Abra a página no Claude para baixar o PDF."; return; }
  try{
    const data=buildPDF(t); const safe=(t.nome||"treinamento").replace(/[\\/:*?"<>|]+/g,"").slice(0,60);
    await S.downloads.save({filename:`Lista de presença - ${safe} - ${fmtDate(t.data).replace(/\//g,"-")}.pdf`, data});
  }catch(e){ if(e&&e.code==="declined") return; note.hidden=false; note.textContent = e&&e.code==="rate_limited" ? "Já há um download aberto. Aguarde e tente de novo." : "Não foi possível gerar o arquivo."; }
}

/* ---------- eventos ---------- */
function bind(){
  const app=$("#app");
  app.onclick=e=>{
    const op=e.target.closest("[data-open]"); if(op){ e.stopPropagation(); go("detalhe",op.dataset.open); return; }
    const a=e.target.closest("[data-act]"); const day=e.target.closest("[data-day]");
    if(a){ const act=a.dataset.act;
      if(act==="prev"){S.month.m--; if(S.month.m<0){S.month.m=11;S.month.y--;} render();}
      else if(act==="next"){S.month.m++; if(S.month.m>11){S.month.m=0;S.month.y++;} render();}
      else if(act==="hoje"){const d=new Date();S.month={y:d.getFullYear(),m:d.getMonth()};render();}
      else if(act==="novo") openForm(null);
      else if(act==="go-agenda") go("agenda");
      else if(act==="editar") openForm(cur());
      else if(act==="duplicar"){ const t=cur(); const d=new Date(t.data+"T12:00:00"); d.setDate(d.getDate()+30);
        const iso=d.toISOString().slice(0,10); openForm({...t,id:null,data:iso,criadoEm:null}); }
      else if(act==="excluir"){S.confirmDel=true;render();}
      else if(act==="excluir-nao"){S.confirmDel=false;render();}
      else if(act==="excluir-sim"){ const id=S.detailId; S.trainings=S.trainings.filter(x=>x.id!==id); write("treinamentos/"+id,()=>S.db.collection("treinamentos").doc(id).delete()).then(()=>toast("Treinamento excluído")); go("agenda"); }
      else if(act==="pdf") downloadPDF();
      else if(act==="todos-p") mutate(c=>c.participantes.forEach(p=>p.presenca="presente"));
      else if(act==="limpar") mutate(c=>c.participantes.forEach(p=>p.presenca=null));
      else if(act==="f-ano"){const y=new Date().getFullYear();S.filt.de=y+"-01-01";S.filt.ate=y+"-12-31";render();}
      else if(act==="f-limpar"){S.filt={de:"",ate:"",setor:S.filt.setor};render();}
      else if(act==="lote") importLote();
      else if(act==="mat-sim") confirmarRemocao();
      else if(act==="portal") atualizarPortal();
      else if(act==="mat-nao"){S.confirmMat=null;render();}
      return;
    }
    if(day && S.canWrite){ openForm(null, day.dataset.day); return; }
    const pr=e.target.closest("[data-pres]"); if(pr){ const i=+pr.dataset.pres, v=pr.dataset.v; mutate(c=>{c.participantes[i].presenca = c.participantes[i].presenca===v?null:v;}); return; }
    const rm=e.target.closest("[data-rm]"); if(rm){ const i=+rm.dataset.rm; mutate(c=>c.participantes.splice(i,1)); return; }
    const rmp=e.target.closest("[data-rmp]"); if(rmp){ const id=rmp.dataset.rmp; S.people=S.people.filter(p=>p.id!==id); render(); savePeople(); return; }
    const dlp=e.target.closest("[data-dlp]"); if(dlp){ baixarPortal(+dlp.dataset.dlp); return; }
    const dlm=e.target.closest("[data-dlm]"); if(dlm){ baixarMaterial(+dlm.dataset.dlm); return; }
    const rmm=e.target.closest("[data-rmm]"); if(rmm){ removerMaterial(+rmm.dataset.rmm); return; }
  };
  app.onkeydown=e=>{ const day=e.target.closest&&e.target.closest("[data-day]"); if(day&&(e.key==="Enter"||e.key===" ")&&e.target===day){e.preventDefault(); if(S.canWrite) openForm(null,day.dataset.day);} };
  const as=$("#add-setor"); if(as) as.onchange=()=>{ const s=as.value; if(!s) return; mutate(c=>{ const have=new Set(c.participantes.map(p=>p.nome.toUpperCase())); S.people.filter(p=>p.setor===s&&!have.has(p.nome.toUpperCase())).sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p=>c.participantes.push({nome:p.nome,setor:p.setor,presenca:null})); }); };
  const ap=$("#add-pessoa"); if(ap) ap.onchange=()=>{ const p=S.people.find(x=>x.id===ap.value); if(p) mutate(c=>c.participantes.push({nome:p.nome,setor:p.setor||"",presenca:null})); };
  const fl=$("#add-livre"); if(fl) fl.onsubmit=e=>{ e.preventDefault(); const n=norm($("#novo-nome").value).toUpperCase(), s=norm($("#novo-setor").value); if(!n) return; mutate(c=>c.participantes.push({nome:n,setor:s,presenca:null})); };
  const mf=$("#mat-file"); if(mf) mf.onchange=()=>{ const fs=[...mf.files]; mf.value=""; if(fs.length) anexarMateriais(fs); };
  const pf=$("#pessoa-form"); if(pf) pf.onsubmit=e=>{ e.preventDefault(); addPeople([[ $("#p-nome").value, $("#p-setor").value ]]); };
  ["f-de","f-ate","f-setor"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=()=>{ S.filt={de:$("#f-de").value,ate:$("#f-ate").value,setor:$("#f-setor").value}; render(); }; });
}
function addPeople(list){
  const have=new Set(S.people.map(p=>p.nome.toUpperCase())); let n=0;
  list.forEach(([nome,setor])=>{ nome=norm(nome).toUpperCase(); setor=norm(setor); if(!nome||have.has(nome)) return; have.add(nome);
    S.people.push({id:"p-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nome,setor}); n++; });
  if(n) savePeople();
  render(); toast(n?`${n} colaborador(es) adicionado(s)`:"Nada novo para adicionar");
}
function savePeople(){ const lista=S.people.map(p=>({id:p.id,nome:p.nome,setor:p.setor||""})); return write("cadastro/colaboradores",()=>S.db.doc("cadastro/colaboradores").set({lista,origem:S.peopleOrigem||"",atualizadoEm:todayISO()})); }
function importLote(){ const raw=$("#p-lote").value; const list=raw.split(/\n+/).map(l=>l.split(/[;\t]/)).filter(r=>norm(r[0])).map(r=>[r[0],r[1]||""]); addPeople(list); }

/* ---------- conexão ---------- */
{const d=new Date();const MS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];$("#subtitle").textContent=`Hoje é ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} · ${MS[d.getMonth()]}/${d.getFullYear()}`;}
fromHash(); render();
if(PORTAL){
  S.trainings=SNAP.treinamentos||[]; S.canWrite=false; S.loaded={t:true,p:true};
  document.title="Portal de Treinamentos"; $(".topbar-title").textContent="Portal de Treinamentos";
  $(".topbar-right").textContent=SNAP.geradoEm?"Atualizado em "+SNAP.geradoEm:"";
  const tc=$("#tab-colaboradores"); if(tc) tc.remove();
  if(S.view==="colaboradores") S.view="agenda";
  render();
  (async()=>{ try{ const c=window.claude; if(c&&c.use){ S.downloads=await c.use("downloads"); if(S.downloads) render(); } }catch(e){} })();
}
if(!PORTAL) (async()=>{
  const c=window.claude;
  if(!c||!c.use){ banner("Abra esta página no Claude para salvar e consultar os treinamentos."); S.canWrite=false; S.loaded={t:true,p:true}; render(); return; }
  const [db,user,dl,as]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads"),c.use("assets")]);
  S.downloads=dl; S.assets=as;
  c.use("mcp").then(m=>{ S.mcp=m; if(m) render(); }).catch(()=>{});
  if(!db){ banner("Entre na sua conta para ver e registrar os treinamentos."); S.canWrite=false; S.loaded={t:true,p:true}; render(); return; }
  S.db=db;
  if(user){ try{ const w=await user.can("data.write"); if(w===false) S.canWrite=false; }catch(e){} }
  const timer=setTimeout(()=>{ if(!S.loaded.t) banner("Os dados ainda não responderam. Verifique a conexão."); },10000);
  db.collection("treinamentos").onSnapshot(snap=>{
    S.trainings=snap.docs.map(d=>({id:d.id,...d.data(),participantes:JSON.parse(JSON.stringify(d.data().participantes||[]))}));
    if(!snap.metadata.fromCache){ S.loaded.t=true; clearTimeout(timer); banner(S.canWrite?"":"Você tem acesso só de leitura a esta página."); }
    if(!$("#modal-root").innerHTML) render();
  }, e=>{ clearTimeout(timer); S.loaded.t=true; banner("Não foi possível carregar os treinamentos."); render(); });
  db.doc("cadastro/colaboradores").onSnapshot(snap=>{
    const d=snap.exists?snap.data():{}; S.people=(d.lista||[]).map(p=>({...p})); S.peopleOrigem=d.origem||""; S.peopleData=d.atualizadoEm||"";
    if(!snap.metadata.fromCache) S.loaded.p=true;
    if(!$("#modal-root").innerHTML) render();
  }, ()=>{ S.loaded.p=true; render(); });
})();
</script>
